name: medaka
description: |
  Per-virus haploid variant calling on nanopore reads with neural-network
  inference. Wraps `medaka_variant` (Medaka 2.x) and emits two filtered
  VCFs per virus — one SNPs-only and one indels-only — post-filtered with
  bcftools to drop variants with `QUAL < params.quality` or
  `INFO/DPSP < params.depth`. The kept records carry the realignment-based
  depth/allele tags (DP, DPS, DPSP, SR, AR, SC, AC, AF) for downstream
  inspection.
keywords:
  - variant calling
  - haploid
  - nanopore
  - medaka
tools:
  - medaka:
      description: Neural-network variant calling and consensus polishing for Oxford Nanopore reads.
      homepage: https://nanoporetech.github.io/medaka/index.html
      documentation: https://nanoporetech.github.io/medaka/index.html
      tool_dev_url: https://github.com/nanoporetech/medaka
      licence: ["Mozilla Public License 2.0"]

input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample/virus information
        e.g. [ id:'sampleA', virus:'denv2' ]
  - reads:
      type: file
      description: Per-virus nanopore reads selected by the upstream classifier.
      pattern: "*.{fasta,fa,fastq,fastq.gz,fq,fq.gz}"
  - assembly:
      type: file
      description: Per-virus reference FASTA against which variants are called.
      pattern: "*.{fasta,fa}"

output:
  - meta:
      type: map
      description: |
        Groovy Map containing sample/virus information
        e.g. [ id:'sampleA', virus:'denv2' ]
  - assembly:
      type: file
      description: |
        Two filtered VCFs per virus, emitted into the same channel and
        publish folder:
          - `<accession>_snps.vcf`  : SNPs only.
          - `<accession>_indel.vcf` : insertions/deletions only.
        Both are pre-filtered with bcftools so that variants with
        `QUAL < params.quality` or `INFO/DPSP < params.depth` are
        removed before splitting/publishing.
      pattern: "*.vcf"
  - versions:
      type: file
      description: File containing software versions (collected into the global `software_versions.yml`; not published into `Variant_calling/medaka/`).
      pattern: "versions.yml"

params:
  - medaka_model:
      type: string
      description: |
        Optional. Medaka model name to override auto-detection
        (e.g. `r1041_e82_400bps_hac_variant_v5.0.0`). Leave unset
        (recommended) to auto-detect the model from the Dorado
        basecaller tags carried by the input reads. If no usable tag
        is present, the pipeline falls back to
        `r1041_e82_400bps_hac_variant_v5.0.0` (HAC). Run
        `medaka tools list_models` in the container to list all
        available names.

authors:
  - "@nanoporetech"
