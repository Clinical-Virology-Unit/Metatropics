# Metatropics — FASTQ input (no POD5 basecalling).
# Samplesheet: nf-metatropics/assets/submission/README.md — cd metatropics_samplesheet/; ./metatropics-samplesheet -i . (or add that folder to PATH)

input: /data/Daan/Projects/T_DCT/Input/samplesheet.csv
outdir: /data/Daan/Projects/T_DCT/Output_l
# Option A (explicit path): provide FASTA paths directly
#Human_host_fasta: /data/Daan/Projects/Metatropics/Databases/Human/chm13v2.0.fa
#Other_host_fasta: /path/to/optional_host.fasta
#
# Option B (keyword): let Metatropics auto-download/cache under <repo>/Databases
#Host: human
dbmeta: /data/Daan/Projects/Metatropics/Databases1/ViralRefseq
# Required for FASTQ workflow: no POD5 / Dorado
basecall: false

minLength: 200
pair: true
front: 25
tail: 25
minVirus: 0.01
quality: 30
depth: 20
agreement: 0.7
rcoverage_figure: true

perform_rarefaction: false
target_bases: 50000000

enable_docker_cleanup: false

# ── Virasign (parallel viral classifier) ──
# run_virasign: true → one Virasign job on ALL samples’ human-depleted FASTQs (cross-sample HTML/CSV).
# Set run_virasign: true to run Virasign alongside MetaMaps.
# All virasign_* params default to Virasign's own upstream defaults when omitted.
run_virasign: true
#irasign_database: RefSeq            # or 'RefSeq' or 'RVDB,RefSeq' or a single accession (e.g. OP526856.1)
#virasign_db_dir: /data/Daan/Projects/DB/      # omit → <Metatropics repo>/Databases (expects e.g. Databases/RVDB)
#virasign_ultrasensitive: true       # -u / --ultrasensitive
#virasign_min_identity: 80            # --min_identity
#virasign_min_mapped_reads: 100       # --min_mapped_reads
#virasign_coverage_depth: 1.0         # --coverage_depth
#virasign_coverage_breadth: 0.1       # --coverage_breadth
#virasign_min_nogr: 5                 # --min-nogr
#virasign_blind: ''                   # -b / --blind (path to blinding list)