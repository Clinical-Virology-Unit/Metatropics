input: /scratch/antwerpen/209/vsc20958/Metatropics_runs/TEST_RUN/Input/mpox.csv
outdir: /scratch/antwerpen/209/vsc20958/Metatropics_runs/TEST_RUN/Output
Human_host_fasta: /scratch/antwerpen/209/vsc20958/Metatropics_runs/Metatropics/Databases/Human/chm13v2.0.fa
