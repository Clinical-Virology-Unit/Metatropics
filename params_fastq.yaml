# Metatropics — FASTQ input (no POD5 basecalling).
# Samplesheet: nf-metatropics/assets/submission/README.md — pip install -e . then metatropics-samplesheet -i . (or PYTHONPATH=nf-metatropics/assets/submission python3 -m metatropics_samplesheet)

input: /data/Daan/Projects/Ane_test/Input/samplesheet.csv
outdir: /data/Daan/Projects/Ane_test/Outdir
Human_host_fasta: /data/Daan/Projects/Metatropics/Databases/Human/chm13v2.0.fa
#Other_host_fasta: /path/to/optional_host.fasta
dbmeta: /data/Daan/Projects/Metatropics/Databases/ViralRefseq
# Required for FASTQ workflow: no POD5 / Dorado
basecall: false

minLength: 200
pair: true
front: 25
tail: 25
minVirus: 0.01
quality: 7
depth: 20
agreement: 0.7
rcoverage_figure: true

perform_rarefaction: false
target_bases: 500000000

enable_docker_cleanup: false
