input: /data/Daan/Projects/Ane/Input/mpox.csv
outdir: /data/Daan/Projects/Ane/Output
Human_host_fasta: /data/Daan/Projects/Metatropics/Databases/Human/chm13v2.0.fa
#Other_host_fasta: /data/Daan/Projects/Metatropics/Databases/Monkeys/AloCar_genomic.fna
dbmeta: /data/Daan/Projects/Metatropics/Databases/ViralRefseq
minLength: 200
pair: true
front: 30
tail: 30
minVirus: 0.01
quality: 20 # You can adapt this to '30' to reach Illumina quality
depth: 20 # When wanting high-quality genomes better adapt this to '20"
agreement: 0.8
horizontal_coverage: 5
rcoverage_figure: true

# Rarefaction parameters
perform_rarefaction: true # Preferably rarefy to a reasonable number of input to decrease time of analysis
target_bases: 500000000

# Cleanup module
enable_docker_cleanup: true
